<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Approval Study</title>
<link rel="stylesheet" href="css/style.css">

<!-- These two load up here, before the page is painted, so that a
     light-theme session does not flash dark first. js/config.js only
     defines STUDY; everything that reads it still loads at the bottom
     of the page, in the order below. -->
<script src="js/config.js"></script>
<script src="js/core/theme.js"></script>
</head>
<body>

<header id="topbar">
  <div class="topbar-title" id="study-title">Agent Approval Study</div>
  <div class="topbar-right">
    <div class="topbar-timer" id="timer"></div>
    <div class="topbar-progress" id="progress"></div>
  </div>
</header>

<main id="screen"></main>

<!-- ─────────────────────────────────────────────────────────────
     Engine (you normally never need to touch these)
     ───────────────────────────────────────────────────────────── -->
<script src="js/core/registry.js"></script>
<script src="js/core/timer.js"></script>
<script src="js/core/results.js"></script>
<script src="js/core/survey.js"></script>
<script src="js/core/agent.js"></script>

<!-- ─────────────────────────────────────────────────────────────
     Study content (edit these)
     ───────────────────────────────────────────────────────────── -->
<!-- Who is in which condition. -->
<script src="js/participants.js"></script>

<script src="js/surveys.js"></script>

<!-- One line per scenario file. Write your own in js/scenarios/
     and add it here:

         <script src="js/scenarios/my-scenario.js"></script>

     Loading a scenario does not put it in the study — js/config.js
     decides which ones participants actually see. -->
<script src="js/scenarios/email-triage-clean.js"></script>
<script src="js/scenarios/email-triage-planted.js"></script>
<script src="js/scenarios/android-reminders.js"></script>

<!-- js/config.js is loaded in the <head> above, with the theme. -->

<!-- Starts everything. Must be last. -->
<script src="js/core/app.js"></script>
</body>
</html>
